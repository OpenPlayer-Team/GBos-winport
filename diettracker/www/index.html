<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:; script-src 'self' 'unsafe-inline' 'unsafe-eval';">
        <meta name="format-detection" content="telephone=no">
        <meta name="msapplication-tap-highlight" content="no">
        <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
        <link rel="stylesheet" href="css/index.css">
        <title>DietTracker</title>
    </head>
    <body>
        <div class="app-container">
            <header>
                <h1>Diario Alimentare</h1>
                <div class="calories-summary">
                    <span id="total-calories">0</span> kcal assunte oggi
                </div>
            </header>

            <main>
                <section class="add-food-section">
                    <h2>Aggiungi pasto</h2>
                    <form id="add-food-form">
                        <div class="input-group">
                            <label for="food-name">Cosa hai mangiato?</label>
                            <input type="text" id="food-name" required placeholder="Es. Mela, Pasta al pomodoro...">
                        </div>
                        <div class="input-group">
                            <label for="food-calories">Calorie (kcal)</label>
                            <input type="number" id="food-calories" required min="1" placeholder="Es. 100">
                        </div>
                        <button type="submit" class="btn-primary">Aggiungi</button>
                    </form>
                </section>

                <section class="food-list-section">
                    <h2>I tuoi pasti di oggi</h2>
                    <ul id="food-list">
                        <!-- Items added dynamically here -->
                    </ul>
                </section>

                <section class="advice-section">
                    <h2>Consigli</h2>
                    <div id="advice-box" class="advice-box">
                        <!-- Advice added dynamically here -->
                    </div>
                </section>

                <button id="btn-clear" class="btn-danger">Azzera Diario</button>
            </main>
        </div>
        <script src="cordova.js"></script>
        <script src="js/index.js"></script>
    </body>
</html>
